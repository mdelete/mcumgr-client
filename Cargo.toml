[package]
name = "mcumgr-client"
version = "0.0.7"
edition = "2024"
repository = "https://github.com/mdelete/mcumgr-client/"
license = "Apache-2.0"
description = "Run MCUmgr commands for uploading firmware updates to an embedded device"
include = ["/src"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = "1"
byteorder = "1.4"
clap = { version = "4", features = ["derive"] }
crc16 = "0.4"
hex = "0.4"
hex-buffer-serde = "0.4.0"
humantime = "2.1.0"
indicatif = "0.18"
lazy_static = "1.4"
log = "0.4"
num = "0.4"
num-derive = "0.4"
num-traits = "0.2"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = "0.11"
serde_json = "1.0"
serde_repr = "0.1"
serialport = { version = "4.7.3", default-features = false }
sha2 = "0.10"
simplelog = "0.12"
nusb = "0.2"
zip = "6"
